<!DOCTYPE html>
<html lang="pt-br">
<head>
    <!-- Configurações básicas do documento e título exibido na aba do navegador -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análise de Cursos Udemy</title>
</head>
<body>
    <main>
        <!-- Captura e exibe alertas ou mensagens de erro enviadas pelo backend Flask -->
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <ul>
            {% for message in messages %}
              <li><strong>{{ message }}</strong></li>
            {% endfor %}
            </ul>
          {% endif %}
        {% endwith %}

        <!-- Espaço dinâmico onde o conteúdo específico de cada página filha será encaixado -->
        {% block content %}{% endblock %}
    </main>
</body>
</html>
